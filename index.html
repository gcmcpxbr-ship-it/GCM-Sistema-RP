<script>
"use strict";

const CHAVE_GUARDAS = "GCM_GUARDAS_RP";
const CHAVE_SESSAO = "GCM_SESSAO_RP";

function $(id) {
    return document.getElementById(id);
}

function pegarGuardas() {
    try {
        const dados = localStorage.getItem(CHAVE_GUARDAS);
        return dados ? JSON.parse(dados) : [];
    } catch {
        return [];
    }
}

function salvarGuardas(guardas) {
    localStorage.setItem(CHAVE_GUARDAS, JSON.stringify(guardas));
}

function esc(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, function (m) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[m];
    });
}

function abrirTela(nome) {
    document.querySelectorAll(".tela").forEach(function (tela) {
        tela.classList.remove("ativa");
    });

    const tela = $(nome);

    if (tela) {
        tela.classList.add("ativa");
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function voltarInicio() {
    abrirTela("inicio");
}

function msg(id, texto, tipo) {
    const elemento = $(id);

    if (!elemento) return;

    elemento.innerHTML =
        '<div class="message ' + tipo + '">' +
        esc(texto) +
        '</div>';
}


/* =========================
   CADASTRO
========================= */

function cadastrar() {

    const nome = $("cadNome").value.trim();
    const rg = $("cadRG").value.trim();
    const cpf = $("cadCPF").value.trim();
    const usuario = $("cadUsuario").value.trim();
    const senha = $("cadSenha").value;

    if (!nome || !rg || !cpf || !usuario || !senha) {
        msg(
            "cadastroMsg",
            "Preencha todos os campos.",
            "error"
        );
        return;
    }

    const guardas = pegarGuardas();

    const existe = guardas.some(function (g) {
        return String(g.usuario).toLowerCase() === usuario.toLowerCase();
    });

    if (existe) {
        msg(
            "cadastroMsg",
            "Esse usuário já está cadastrado.",
            "error"
        );
        return;
    }

    const novoGuarda = {
        id:
            Date.now() +
            "_" +
            Math.random().toString(16).slice(2),

        nome: nome,
        rg: rg,
        cpf: cpf,
        usuario: usuario,
        senha: senha,

        status: "pendente",

        porte: null,

        data: new Date().toLocaleString("pt-BR")
    };

    guardas.push(novoGuarda);

    salvarGuardas(guardas);

    $("cadNome").value = "";
    $("cadRG").value = "";
    $("cadCPF").value = "";
    $("cadUsuario").value = "";
    $("cadSenha").value = "";

    msg(
        "cadastroMsg",
        "Cadastro enviado! Aguarde a aprovação da Corregedoria.",
        "ok"
    );
}


/* =========================
   LOGIN DO GUARDA
========================= */

function fazerLogin() {

    const usuario = $("loginUsuario").value.trim();
    const senha = $("loginSenha").value;

    if (!usuario || !senha) {
        msg(
            "loginMsg",
            "Digite usuário e senha.",
            "error"
        );
        return;
    }

    const guardas = pegarGuardas();

    const guarda = guardas.find(function (g) {

        return (
            String(g.usuario).toLowerCase() ===
            usuario.toLowerCase() &&
            String(g.senha) === senha
        );

    });

    if (!guarda) {
        msg(
            "loginMsg",
            "Usuário ou senha incorretos.",
            "error"
        );
        return;
    }

    if (guarda.status !== "aprovado") {

        if (guarda.status === "rejeitado") {

            msg(
                "loginMsg",
                "Seu cadastro foi rejeitado pela Corregedoria.",
                "error"
            );

        } else {

            msg(
                "loginMsg",
                "Seu cadastro ainda está pendente de aprovação.",
                "error"
            );
        }

        return;
    }

    localStorage.setItem(
        CHAVE_SESSAO,
        JSON.stringify({
            tipo: "guarda",
            id: guarda.id
        })
    );

    abrirPainelGuarda(guarda.id);
}


/* =========================
   PAINEL DO GUARDA
========================= */

function abrirPainelGuarda(id) {

    const guardas = pegarGuardas();

    const guarda = guardas.find(function (g) {
        return String(g.id) === String(id);
    });

    if (!guarda) {
        sair();
        return;
    }

    $("guardaBemVindo").textContent =
        "Bem-vindo, " + guarda.nome + ".";

    let html = `
        <div class="permit">

            <div class="permit-title">
                DADOS FUNCIONAIS • RP
            </div>

            <div class="line">
                <b>Nome:</b> ${esc(guarda.nome)}
            </div>

            <div class="line">
                <b>RG:</b> ${esc(guarda.rg)}
            </div>

            <div class="line">
                <b>CPF:</b> ${esc(guarda.cpf)}
            </div>

            <div class="line">
                <b>Usuário:</b> ${esc(guarda.usuario)}
            </div>

            <div class="line">
                <b>Status:</b>
                <span class="status approved">
                    APROVADO
                </span>
            </div>

        </div>
    `;


    /* SEM SOLICITAÇÃO */

    if (!guarda.porte) {

        html += `
            <div class="permit">

                <div class="permit-title">
                    AUTORIZAÇÃO DE ARMAMENTO
                </div>

                <div class="weapon">
                    9mm — Beretta
                </div>

                <p class="subtitle">
                    Solicite a autorização para análise
                    da Corregedoria.
                </p>

                <button
                    class="primary"
                    onclick="solicitarPorte()"
                >
                    Solicitar autorização
                </button>

            </div>
        `;

    }


    /* PENDENTE */

    else if (guarda.porte.status === "pendente") {

        html += `
            <div class="permit">

                <div class="permit-title">
                    SOLICITAÇÃO DE ARMAMENTO
                </div>

                <div class="weapon">
                    9mm — Beretta
                </div>

                <span class="status pending">
                    PENDENTE
                </span>

            </div>
        `;

    }


    /* APROVADO */

    else if (guarda.porte.status === "aprovado") {

        html += `
            <div class="permit">

                <div class="permit-title">
                    AUTORIZAÇÃO APROVADA • RP
                </div>

                <div class="weapon">
                    9mm — Beretta
                </div>

                <div class="line">
                    <b>Nome:</b> ${esc(guarda.nome)}
                </div>

                <div class="line">
                    <b>RG:</b> ${esc(guarda.rg)}
                </div>

                <div class="line">
                    <b>CPF:</b> ${esc(guarda.cpf)}
                </div>

                <div class="line">
                    <b>Armamento:</b>
                    9mm — Beretta
                </div>

                <div class="line">
                    <b>Status:</b>

                    <span class="status approved">
                        APROVADO
                    </span>

                </div>

            </div>
        `;

    }


    /* REJEITADO */

    else {

        html += `
            <div class="permit">

                <div class="permit-title">
                    SOLICITAÇÃO DE ARMAMENTO
                </div>

                <div class="weapon">
                    9mm — Beretta
                </div>

                <span class="status rejected">
                    REJEITADA
                </span>

                <button
                    class="primary"
                    style="margin-top:18px"
                    onclick="solicitarPorte()"
                >
                    Solicitar novamente
                </button>

            </div>
        `;
    }

    $("guardaConteudo").innerHTML = html;

    abrirTela("painelGuarda");
}


/* =========================
   SOLICITAR PORTE
========================= */

function solicitarPorte() {

    const sessao = JSON.parse(
        localStorage.getItem(CHAVE_SESSAO) || "null"
    );

    if (!sessao || sessao.tipo !== "guarda") {
        return;
    }

    const guardas = pegarGuardas();

    const guarda = guardas.find(function (g) {
        return g.id === sessao.id;
    });

    if (!guarda) return;

    guarda.porte = {

        status: "pendente",

        arma: "9mm — Beretta",

        data: new Date().toLocaleString("pt-BR")

    };

    salvarGuardas(guardas);

    abrirPainelGuarda(guarda.id);
}


/* =========================
   LOGIN CORREGEDORIA
========================= */

function entrarCorregedoria() {

    const usuario = $("corUsuario").value.trim();
    const senha = $("corSenha").value;

    if (
        usuario === "GCGM-2026" &&
        senha === "GCGM-2026"
    ) {

        localStorage.setItem(
            CHAVE_SESSAO,
            JSON.stringify({
                tipo: "corregedoria"
            })
        );

        carregarCorregedoria();

        abrirTela("painelCorregedoria");

        return;
    }

    msg(
        "corMsg",
        "Usuário ou senha da Corregedoria incorretos.",
        "error"
    );
}


/* =========================
   CORREGEDORIA
========================= */

function carregarCorregedoria() {

    const guardas = pegarGuardas();


    /* CADASTROS */

    if (guardas.length === 0) {

        $("listaGuardas").innerHTML = `
            <div class="empty">
                Nenhum cadastro recebido.
            </div>
        `;

    } else {

        $("listaGuardas").innerHTML =
            guardas.map(function (g) {

                let classe =
                    g.status === "aprovado"
                        ? "approved"
                        : g.status === "rejeitado"
                        ? "rejected"
                        : "pending";

                let botoes = "";

                if (g.status === "pendente") {

                    botoes = `
                        <div class="actions">

                            <button
                                class="success"
                                onclick="aprovarGuarda('${g.id}')"
                            >
                                ✓ Aprovar
                            </button>

                            <button
                                class="danger"
                                onclick="rejeitarGuarda('${g.id}')"
                            >
                                ✕ Rejeitar
                            </button>

                        </div>
                    `;
                }

                return `
                    <div class="item">

                        <h3>
                            ${esc(g.nome)}
                        </h3>

                        <p>
                            <b>RG:</b>
                            ${esc(g.rg)}
                        </p>

                        <p>
                            <b>CPF:</b>
                            ${esc(g.cpf)}
                        </p>

                        <p>
                            <b>Usuário:</b>
                            ${esc(g.usuario)}
                        </p>

                        <p>
                            <b>Data:</b>
                            ${esc(g.data)}
                        </p>

                        <p>
                            <span class="status ${classe}">
                                ${esc(g.status.toUpperCase())}
                            </span>
                        </p>

                        ${botoes}

                    </div>
                `;

            }).join("");
    }


    /* SOLICITAÇÕES DE ARMAMENTO */

    const pedidos = guardas.filter(function (g) {
        return g.porte;
    });


    if (pedidos.length === 0) {

        $("listaPorte").innerHTML = `
            <div class="empty">
                Nenhuma solicitação de armamento.
            </div>
        `;

    } else {

        $("listaPorte").innerHTML =
            pedidos.map(function (g) {

                let classe =
                    g.porte.status === "aprovado"
                        ? "approved"
                        : g.porte.status === "rejeitado"
                        ? "rejected"
                        : "pending";

                let botoes = "";

                if (g.porte.status === "pendente") {

                    botoes = `
                        <div class="actions">

                            <button
                                class="success"
                                onclick="aprovarPorte('${g.id}')"
                            >
                                ✓ Aprovar
                            </button>

                            <button
                                class="danger"
                                onclick="rejeitarPorte('${g.id}')"
                            >
                                ✕ Rejeitar
                            </button>

                        </div>
                    `;
                }

                return `
                    <div class="item">

                        <h3>
                            ${esc(g.nome)}
                        </h3>

                        <p>
                            <b>RG:</b>
                            ${esc(g.rg)}
                        </p>

                        <p>
                            <b>CPF:</b>
                            ${esc(g.cpf)}
                        </p>

                        <p>
                            <b>Armamento:</b>
                            9mm — Beretta
                        </p>

                        <p>
                            <span class="status ${classe}">
                                ${esc(
                                    g.porte.status.toUpperCase()
                                )}
                            </span>
                        </p>

                        ${botoes}

                    </div>
                `;

            }).join("");
    }
}


/* =========================
   APROVAR / REJEITAR GUARDA
========================= */

function alterarGuarda(id, status) {

    const guardas = pegarGuardas();

    const guarda = guardas.find(function (g) {
        return g.id === id;
    });

    if (!guarda) return;

    guarda.status = status;

    salvarGuardas(guardas);

    carregarCorregedoria();
}

function aprovarGuarda(id) {
    alterarGuarda(id, "aprovado");
}

function rejeitarGuarda(id) {
    alterarGuarda(id, "rejeitado");
}


/* =========================
   APROVAR / REJEITAR PORTE
========================= */

function alterarPorte(id, status) {

    const guardas = pegarGuardas();

    const guarda = guardas.find(function (g) {
        return g.id === id;
    });

    if (!guarda || !guarda.porte) return;

    guarda.porte.status = status;

    salvarGuardas(guardas);

    carregarCorregedoria();
}

function aprovarPorte(id) {
    alterarPorte(id, "aprovado");
}

function rejeitarPorte(id) {
    alterarPorte(id, "rejeitado");
}


/* =========================
   SAIR
========================= */

function sair() {

    localStorage.removeItem(CHAVE_SESSAO);

    abrirTela("inicio");
}


/* =========================
   RESTAURAR SESSÃO
========================= */

function restaurarSessao() {

    try {

        const sessao = JSON.parse(
            localStorage.getItem(CHAVE_SESSAO) || "null"
        );

        if (!sessao) return;

        if (sessao.tipo === "guarda") {

            abrirPainelGuarda(sessao.id);

        }

        if (sessao.tipo === "corregedoria") {

            carregarCorregedoria();

            abrirTela("painelCorregedoria");

        }

    } catch {

        localStorage.removeItem(CHAVE_SESSAO);
    }
}


/* =========================
   ENTER PARA ENVIAR
========================= */

$("loginSenha").addEventListener(
    "keydown",
    function (e) {
        if (e.key === "Enter") {
            fazerLogin();
        }
    }
);

$("corSenha").addEventListener(
    "keydown",
    function (e) {
        if (e.key === "Enter") {
            entrarCorregedoria();
        }
    }
);

$("cadSenha").addEventListener(
    "keydown",
    function (e) {
        if (e.key === "Enter") {
            cadastrar();
        }
    }
);


/* =========================
   INICIAR
========================= */

restaurarSessao();

</script>
